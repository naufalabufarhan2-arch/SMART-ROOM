<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - SMART ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="wrapper d-flex">
        <nav id="sidebar" class="sidebar bg-dark text-white min-vh-100 p-3" style="width: 250px;">
            <div class="sidebar-header mb-4"><h3>SMART ROOM</h3></div>
            <ul class="list-unstyled components">
                <li class="mb-2"><a href="../dashboard.html" class="text-white text-decoration-none"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="mb-2"><a href="rooms.html" class="text-white text-decoration-none"><i class="fas fa-door-open me-2"></i> Daftar Ruangan</a></li>
                <li class="mb-2"><a href="booking.html" class="text-white text-decoration-none"><i class="fas fa-calendar-plus me-2"></i> Peminjaman</a></li>
                <li class="mb-2"><a href="locker.html" class="text-white text-decoration-none"><i class="fas fa-key me-2"></i> Loker Kunci</a></li>
                <li class="mb-2"><a href="history.html" class="text-white text-decoration-none"><i class="fas fa-history me-2"></i> Riwayat</a></li>
                <li class="mb-2"><a href="schedule.html" class="text-white text-decoration-none"><i class="fas fa-calendar-alt me-2"></i> Jadwal</a></li>
            </ul>
        </nav>

        <div id="content" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                <h2 class="mb-4">Profil Pengguna</h2>
                
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm text-center p-4">
                            <img src="../img/default-avatar.png" class="rounded-circle mx-auto mb-3" width="120" height="120" alt="Avatar">
                            <h4>Budi Santoso</h4>
                            <p class="text-muted">User Reguler</p>
                            <p class="small text-muted">Anggota sejak: 2023</p>
                            <button class="btn btn-outline-primary btn-sm mt-2">Ubah Foto</button>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card shadow-sm mb-4">
                            <div class="card-header bg-white"><h5>Edit Profil</h5></div>
                            <div class="card-body">
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label">Nama Lengkap</label>
                                        <input type="text" class="form-control" value="Budi Santoso">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" value="budi@example.com" readonly>
                                    </div>
                                    <button class="btn btn-primary">Simpan Perubahan</button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="card shadow-sm">
                            <div class="card-header bg-white"><h5>Ubah Password</h5></div>
                            <div class="card-body">
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label">Password Lama</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password Baru</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Konfirmasi Password</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <button class="btn btn-warning text-white">Update Password</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
