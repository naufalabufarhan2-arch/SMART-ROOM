<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Ruangan - SMART ROOM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .room-card { transition: transform 0.2s; }
        .room-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .room-status-available { border-top: 4px solid #198754; }
        .room-status-used { border-top: 4px solid #dc3545; }
        .room-status-soon { border-top: 4px solid #ffc107; }
        .skeleton { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 5px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
        @keyframes shine { to { background-position-x: -200%; } }
    </style>
</head>
<body>
    <div class="wrapper d-flex">
        <nav id="sidebar" class="sidebar bg-dark text-white min-vh-100 p-3" style="width: 250px;">
            <div class="sidebar-header mb-4">
                <h3>SMART ROOM</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="mb-2"><a href="../dashboard.html" class="text-white text-decoration-none"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="active mb-2"><a href="rooms.html" class="text-white text-decoration-none fw-bold"><i class="fas fa-door-open me-2"></i> Daftar Ruangan</a></li>
                <li class="mb-2"><a href="booking.html" class="text-white text-decoration-none"><i class="fas fa-calendar-plus me-2"></i> Peminjaman</a></li>
                <li class="mb-2"><a href="locker.html" class="text-white text-decoration-none"><i class="fas fa-key me-2"></i> Loker Kunci</a></li>
                <li class="mb-2"><a href="history.html" class="text-white text-decoration-none"><i class="fas fa-history me-2"></i> Riwayat</a></li>
                <li class="mb-2"><a href="schedule.html" class="text-white text-decoration-none"><i class="fas fa-calendar-alt me-2"></i> Jadwal</a></li>
            </ul>
        </nav>

        <div id="content" class="w-100 bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-outline-secondary d-md-none"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto d-flex align-items-center">
                        <a href="notifications.html" class="nav-link position-relative me-3">
                            <i class="fas fa-bell fs-5"></i>
                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" id="notification-badge" style="display: none;"></span>
                        </a>
                        <div class="dropdown">
                            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="../img/default-avatar.png" alt="" width="32" height="32" class="rounded-circle me-2" id="userAvatar">
                                <strong id="userName">User</strong>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUser">
                                <li><a class="dropdown-item" href="profile.html">Profil</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" id="btnLogout">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4">
                <h2 class="mb-4">Daftar Ruangan</h2>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <input type="text" id="searchInput" class="form-control" placeholder="Cari nama ruangan...">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <select id="statusFilter" class="form-select">
                            <option value="all">Semua Status</option>
                            <option value="available">Tersedia</option>
                            <option value="used">Sedang Digunakan</option>
                        </select>
                    </div>
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="roomsContainer">
                    <!-- Skeletons -->
                    <div class="col"><div class="card p-3"><div class="skeleton" style="height: 150px; width:100%; margin-bottom:10px;"></div><div class="skeleton" style="height: 20px; width:50%;"></div></div></div>
                    <div class="col"><div class="card p-3"><div class="skeleton" style="height: 150px; width:100%; margin-bottom:10px;"></div><div class="skeleton" style="height: 20px; width:50%;"></div></div></div>
                    <div class="col"><div class="card p-3"><div class="skeleton" style="height: 150px; width:100%; margin-bottom:10px;"></div><div class="skeleton" style="height: 20px; width:50%;"></div></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detail Ruangan -->
    <div class="modal fade" id="roomDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="roomDetailTitle">Detail Ruangan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="roomDetailBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primary" id="modalPinjamBtn">Pinjam Ruangan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(user => {
                if (!user) return window.location.href = '../login.html';
                initRooms();
            });
            
            const roomsContainer = document.getElementById('roomsContainer');
            const searchInput = document.getElementById('searchInput');
            const statusFilter = document.getElementById('statusFilter');
            let allRooms = [];
            
            function initRooms() {
                const db = firebase.firestore();
                // Mock rooms if db fails
                db.collection('rooms').onSnapshot(snapshot => {
                    allRooms = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                    renderRooms();
                }, err => {
                    console.error("Error fetching rooms", err);
                    allRooms = [
                        {id: 'R1', name: 'Ruang Rapat A', capacity: 20, location: 'Lantai 1', status: 'available', description: 'Ruang rapat utama dengan proyektor'},
                        {id: 'R2', name: 'Ruang Rapat B', capacity: 10, location: 'Lantai 1', status: 'used', description: 'Ruang rapat kecil'}
                    ];
                    renderRooms();
                });
            }

            function renderRooms() {
                const searchTxt = searchInput.value.toLowerCase();
                const filterVal = statusFilter.value;
                
                roomsContainer.innerHTML = '';
                const filtered = allRooms.filter(r => {
                    const matchSearch = r.name.toLowerCase().includes(searchTxt);
                    const matchStatus = filterVal === 'all' || r.status === filterVal;
                    return matchSearch && matchStatus;
                });
                
                if (filtered.length === 0) {
                    roomsContainer.innerHTML = '<div class="col-12"><p class="text-center text-muted">Tidak ada ruangan ditemukan.</p></div>';
                    return;
                }

                filtered.forEach(room => {
                    const isAvail = room.status !== 'used';
                    const statusClass = isAvail ? 'room-status-available' : 'room-status-used';
                    const badge = isAvail ? '<span class="badge bg-success">🟢 Tersedia</span>' : '<span class="badge bg-danger">🔴 Digunakan</span>';
                    
                    const div = document.createElement('div');
                    div.className = 'col';
                    div.innerHTML = `
                        <div class="card h-100 shadow-sm ${statusClass} room-card">
                            <div class="card-body">
                                <h5 class="card-title">${room.name}</h5>
                                <p class="text-muted small"><i class="fas fa-map-marker-alt"></i> ${room.location} &nbsp; <i class="fas fa-users"></i> ${room.capacity} org</p>
                                <p class="card-text text-truncate">${room.description || 'Tidak ada deskripsi'}</p>
                                <div class="mb-3">${badge}</div>
                            </div>
                            <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
                                <button class="btn btn-outline-secondary btn-sm" onclick="showDetail('${room.id}')">Detail</button>
                                <button class="btn btn-primary btn-sm" ${!isAvail ? 'disabled' : ''} onclick="bookRoom('${room.id}')">Pinjam</button>
                            </div>
                        </div>
                    `;
                    roomsContainer.appendChild(div);
                });
            }

            searchInput.addEventListener('input', renderRooms);
            statusFilter.addEventListener('change', renderRooms);

            window.showDetail = (roomId) => {
                const room = allRooms.find(r => r.id === roomId);
                if(!room) return;
                
                document.getElementById('roomDetailTitle').textContent = room.name;
                document.getElementById('roomDetailBody').innerHTML = `
                    <p><strong>Lokasi:</strong> ${room.location}</p>
                    <p><strong>Kapasitas:</strong> ${room.capacity} orang</p>
                    <p><strong>Deskripsi:</strong> ${room.description}</p>
                    <hr>
                    <h6>Jadwal Hari Ini</h6>
                    <p class="text-muted small">Memuat jadwal...</p>
                `;
                
                const btn = document.getElementById('modalPinjamBtn');
                btn.disabled = room.status === 'used';
                btn.onclick = () => bookRoom(roomId);
                
                new bootstrap.Modal(document.getElementById('roomDetailModal')).show();
            };

            window.bookRoom = (roomId) => {
                sessionStorage.setItem('selectedRoomId', roomId);
                window.location.href = 'booking.html';
            };
        });
    </script>
</body>
</html>
