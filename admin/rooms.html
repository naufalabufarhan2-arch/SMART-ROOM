<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Ruangan - Smart Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <!-- Sidebar -->
        <nav class="admin-sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-building-circle-check"></i> SMART ROOM</div>
            <ul class="sidebar-nav">
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="rooms.html" class="active"><i class="fa-solid fa-door-open"></i> Kelola Ruangan</a></li>
                <li><a href="lockers.html"><i class="fa-solid fa-lock"></i> Kelola Loker</a></li>
                <li><a href="bookings.html"><i class="fa-solid fa-clipboard-list"></i> Kelola Peminjaman</a></li>
                <li><a href="users.html"><i class="fa-solid fa-users"></i> Kelola Pengguna</a></li>
                <li><a href="monitoring.html"><i class="fa-solid fa-desktop"></i> Monitoring</a></li>
                <li><a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Kelola Ruangan</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#roomModal"><i class="fa-solid fa-plus"></i> Tambah Ruangan</button>
                </div>

                <div class="admin-panel">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" placeholder="Cari ruangan...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select">
                                <option value="">Semua Status</option>
                                <option value="active">Aktif</option>
                                <option value="inactive">Nonaktif</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Nomor</th>
                                    <th>Lokasi</th>
                                    <th>Kapasitas</th>
                                    <th>Loker</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="roomsTableBody">
                                <!-- Dummy Data -->
                                <tr>
                                    <td>R001</td>
                                    <td>Ruang Rapat A</td>
                                    <td>101</td>
                                    <td>Lantai 1</td>
                                    <td>10 Orang</td>
                                    <td>L-01</td>
                                    <td><span class="badge bg-success">Aktif</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pencil"></i></button>
                                        <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                                        <button class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-power-off"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Room Modal -->
    <div class="modal fade" id="roomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah / Edit Ruangan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="roomForm">
                        <div class="mb-3">
                            <label>Nama Ruangan</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Nomor Ruangan</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Lokasi</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Kapasitas</label>
                            <input type="number" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Deskripsi</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Pilih Loker</label>
                            <select class="form-select">
                                <option value="">Pilih Loker (Opsional)</option>
                                <option value="L-01">L-01</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Status</label>
                            <select class="form-select">
                                <option value="active">Aktif</option>
                                <option value="inactive">Nonaktif</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
