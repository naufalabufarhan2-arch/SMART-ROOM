<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Peminjaman - Smart Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <!-- Sidebar -->
        <nav class="admin-sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-building-circle-check"></i> SMART ROOM</div>
            <ul class="sidebar-nav">
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="rooms.html"><i class="fa-solid fa-door-open"></i> Kelola Ruangan</a></li>
                <li><a href="lockers.html"><i class="fa-solid fa-lock"></i> Kelola Loker</a></li>
                <li><a href="bookings.html" class="active"><i class="fa-solid fa-clipboard-list"></i> Kelola Peminjaman</a></li>
                <li><a href="users.html"><i class="fa-solid fa-users"></i> Kelola Pengguna</a></li>
                <li><a href="monitoring.html"><i class="fa-solid fa-desktop"></i> Monitoring</a></li>
                <li><a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Kelola Peminjaman</h2>
                    <button class="btn btn-outline-success"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                </div>

                <div class="admin-panel">
                    <!-- Filters -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <input type="text" class="form-control" placeholder="Cari nama peminjam / ruangan...">
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-calendar"></i></span>
                                <input type="date" class="form-control">
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs admin-tabs mb-4" id="bookingTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#semua" type="button">Semua</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#menunggu" type="button">
                                Menunggu <span class="badge bg-danger ms-1">2</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#disetujui" type="button">Disetujui</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#aktif" type="button">Aktif</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#selesai" type="button">Selesai</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#ditolak" type="button">Ditolak</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="myTabContent">
                        <!-- Menunggu Tab (Active for demo) -->
                        <div class="tab-pane fade show active" id="semua">
                            <div class="table-responsive">
                                <table class="table admin-table align-middle">
                                    <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>Peminjam</th>
                                            <th>Ruangan</th>
                                            <th>Tanggal</th>
                                            <th>Waktu</th>
                                            <th>Keperluan</th>
                                            <th>Status</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Dummy pending row -->
                                        <tr class="table-warning">
                                            <td>1</td>
                                            <td>Andi Wijaya</td>
                                            <td>Ruang Rapat A</td>
                                            <td>2023-10-25</td>
                                            <td>09:00 - 11:00</td>
                                            <td>Rapat Divisi</td>
                                            <td><span class="badge bg-warning text-dark">Menunggu</span></td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-success" title="Setujui" data-bs-toggle="modal" data-bs-target="#approveModal"><i class="fa-solid fa-check"></i></button>
                                                    <button class="btn btn-danger" title="Tolak" data-bs-toggle="modal" data-bs-target="#rejectModal"><i class="fa-solid fa-xmark"></i></button>
                                                    <button class="btn btn-secondary" title="Detail" data-bs-toggle="modal" data-bs-target="#detailModal"><i class="fa-solid fa-eye"></i></button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals for Approve, Reject, Detail omitted for brevity but should exist in real app -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
