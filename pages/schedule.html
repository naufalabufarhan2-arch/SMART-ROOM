<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Ruangan - SMART ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <div class="wrapper d-flex">
        <nav id="sidebar" class="sidebar bg-dark text-white min-vh-100 p-3" style="width: 250px;">
            <div class="sidebar-header mb-4"><h3>SMART ROOM</h3></div>
            <ul class="list-unstyled components">
                <li class="mb-2"><a href="../dashboard.html" class="text-white text-decoration-none"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="mb-2"><a href="rooms.html" class="text-white text-decoration-none"><i class="fas fa-door-open me-2"></i> Daftar Ruangan</a></li>
                <li class="mb-2"><a href="booking.html" class="text-white text-decoration-none"><i class="fas fa-calendar-plus me-2"></i> Peminjaman</a></li>
                <li class="mb-2"><a href="locker.html" class="text-white text-decoration-none"><i class="fas fa-key me-2"></i> Loker Kunci</a></li>
                <li class="mb-2"><a href="history.html" class="text-white text-decoration-none"><i class="fas fa-history me-2"></i> Riwayat</a></li>
                <li class="active mb-2"><a href="schedule.html" class="text-white text-decoration-none fw-bold"><i class="fas fa-calendar-alt me-2"></i> Jadwal</a></li>
            </ul>
        </nav>

        <div id="content" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                <h2 class="mb-4">Jadwal Ruangan</h2>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [
                    { title: 'R. Rapat A - Budi', start: new Date().toISOString().split('T')[0] + 'T10:00:00', end: new Date().toISOString().split('T')[0] + 'T12:00:00', backgroundColor: '#0d6efd' }
                ]
            });
            calendar.render();
        });
    </script>
</body>
</html>
