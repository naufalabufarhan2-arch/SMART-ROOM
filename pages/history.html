<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Peminjaman - SMART ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="wrapper d-flex">
        <nav id="sidebar" class="sidebar bg-dark text-white min-vh-100 p-3" style="width: 250px;">
            <div class="sidebar-header mb-4"><h3>SMART ROOM</h3></div>
            <ul class="list-unstyled components">
                <li class="mb-2"><a href="../dashboard.html" class="text-white text-decoration-none"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="mb-2"><a href="rooms.html" class="text-white text-decoration-none"><i class="fas fa-door-open me-2"></i> Daftar Ruangan</a></li>
                <li class="mb-2"><a href="booking.html" class="text-white text-decoration-none"><i class="fas fa-calendar-plus me-2"></i> Peminjaman</a></li>
                <li class="mb-2"><a href="locker.html" class="text-white text-decoration-none"><i class="fas fa-key me-2"></i> Loker Kunci</a></li>
                <li class="active mb-2"><a href="history.html" class="text-white text-decoration-none fw-bold"><i class="fas fa-history me-2"></i> Riwayat</a></li>
                <li class="mb-2"><a href="schedule.html" class="text-white text-decoration-none"><i class="fas fa-calendar-alt me-2"></i> Jadwal</a></li>
            </ul>
        </nav>

        <div id="content" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                <h2 class="mb-4">Riwayat Peminjaman</h2>
                
                <div class="row mb-4">
                    <div class="col-md-3"><div class="card text-center p-3 text-white bg-primary"><h5>Total</h5><h3 id="statTotal">0</h3></div></div>
                    <div class="col-md-3"><div class="card text-center p-3 text-white bg-success"><h5>Selesai</h5><h3 id="statDone">0</h3></div></div>
                    <div class="col-md-3"><div class="card text-center p-3 text-white bg-info"><h5>Aktif</h5><h3 id="statActive">0</h3></div></div>
                    <div class="col-md-3"><div class="card text-center p-3 text-white bg-danger"><h5>Terlambat</h5><h3 id="statLate">0</h3></div></div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <input type="text" class="form-control w-25" placeholder="Cari Ruangan...">
                            <select class="form-select w-25">
                                <option value="">Semua Status</option>
                                <option value="Selesai">Selesai</option>
                                <option value="Aktif">Aktif</option>
                            </select>
                            <button class="btn btn-secondary"><i class="fas fa-file-export"></i> Export</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>No</th><th>Ruangan</th><th>Tanggal</th><th>Mulai</th><th>Selesai</th><th>Status</th><th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTable">
                                    <!-- Mock Data -->
                                    <tr>
                                        <td>1</td><td>Ruang Rapat A</td><td>2023-10-01</td><td>08:00</td><td>10:00</td>
                                        <td><span class="badge bg-success">Selesai</span></td>
                                        <td><button class="btn btn-sm btn-info text-white">Detail</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('statTotal').innerText = "1";
        document.getElementById('statDone').innerText = "1";
    </script>
</body>
</html>
